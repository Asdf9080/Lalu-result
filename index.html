<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Portal</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; margin-bottom: 20px; }
    .header h2 { margin: 0; color: #2c3e50; }
    .search-box { background: #eef2f5; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .btn-submit { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-submit:hover { background-color: #219150; }
    .error-msg { color: #e74c3c; text-align: center; font-weight: bold; margin-top: 10px; display: none; }
    .result-card { display: none; margin-top: 20px; }
    .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #34495e; color: white; }
    .summary { margin-top: 20px; padding: 15px; background: #e8f8f5; border-radius: 6px; font-weight: bold; display: flex; justify-content: space-between; }
    .print-btn { background: #2980b9; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; float: right; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 id="school-name">Loading...</h2>
    <p id="school-address"></p>
    <p id="school-code"></p>
  </div>

  <div class="search-box">
    <div class="form-group">
      <label for="rollInput">Roll No (रोल नंबर):</label>
      <input type="text" id="rollInput" placeholder="उदा. 1101">
    </div>
    <div class="form-group">
      <label for="dobInput">Date of Birth (DD/MM/YYYY):</label>
      <input type="text" id="dobInput" placeholder="उदा. 01/01/2010">
    </div>
    <button class="btn-submit" onclick="searchResult()">View Result</button>
    <div class="error-msg" id="errorMsg">रोल नंबर या जन्म तिथि गलत है!</div>
  </div>

  <div class="result-card" id="resultCard">
    <h3>Annual Examination Result (<span id="res-session"></span>)</h3>
    <div class="student-info">
      <div><strong>Student Name:</strong> <span id="res-name"></span></div>
      <div><strong>Roll No:</strong> <span id="res-roll"></span></div>
      <div><strong>Father's Name:</strong> <span id="res-father"></span></div>
      <div><strong>Reg No:</strong> <span id="res-reg"></span></div>
      <div><strong>Mother's Name:</strong> <span id="res-mother"></span></div>
      <div><strong>Class:</strong> <span id="res-class"></span> (<span id="res-sec"></span>)</div>
      <div><strong>DOB:</strong> <span id="res-dob"></span></div>
      <div><strong>Attendance:</strong> <span id="res-attendance"></span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Term 1 (50)</th>
          <th>Term 2 (50)</th>
          <th>Final Test (100)</th>
          <th>Total Obtained</th>
        </tr>
      </thead>
      <tbody id="marks-body"></tbody>
    </table>

    <div class="summary">
      <div>Grand Total: <span id="grand-total"></span> / <span id="max-total"></span></div>
      <div>Percentage: <span id="percentage"></span>%</div>
    </div>

    <button class="print-btn" onclick="window.print()">Print Marksheet</button>
  </div>
</div>

<script>
  let resultData = null;

  // JSON फ़ाइल को Fetch API से लोड करना
  fetch('data.json')
    .then(response => {
      if (!response.ok) {
        throw new Error("JSON file load nahi ho saki!");
      }
      return response.json();
    })
    .then(data => {
      resultData = data;
      // Header details fill karna
      document.getElementById("school-name").innerText = resultData.schoolInfo.name;
      document.getElementById("school-address").innerText = resultData.schoolInfo.address;
      document.getElementById("school-code").innerText = resultData.schoolInfo.code;
    })
    .catch(error => {
      console.error("Error loading JSON:", error);
      document.getElementById("school-name").innerText = "Data Load karne me error aaya!";
    });

  function searchResult() {
    if (!resultData) {
      alert("Data abhi load nahi hua hai, kripya thoda wait karein!");
      return;
    }

    const inputRoll = document.getElementById("rollInput").value.trim();
    const inputDob = document.getElementById("dobInput").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    errorMsg.style.display = "none";
    resultCard.style.display = "none";

    const student = resultData.students.find(s => s.roll === inputRoll && s.dob === inputDob);

    if (student) {
      document.getElementById("res-session").innerText = student.session;
      document.getElementById("res-name").innerText = student.name;
      document.getElementById("res-roll").innerText = student.roll;
      document.getElementById("res-father").innerText = student.father;
      document.getElementById("res-mother").innerText = student.mother;
      document.getElementById("res-reg").innerText = student.regNo;
      document.getElementById("res-class").innerText = student.class;
      document.getElementById("res-sec").innerText = student.sec;
      document.getElementById("res-dob").innerText = student.dob;
      document.getElementById("res-attendance").innerText = student.attendance;

      const marksBody = document.getElementById("marks-body");
      marksBody.innerHTML = "";

      let totalObtained = 0;
      let totalMaxMarks = 0;

      for (const [subject, mark] of Object.entries(student.marks)) {
        const subTotal = mark.t1 + mark.t2 + mark.ft;
        totalObtained += subTotal;
        totalMaxMarks += 200;

        const row = `<tr>
          <td>${subject}</td>
          <td>${mark.t1}</td>
          <td>${mark.t2}</td>
          <td>${mark.ft}</td>
          <td><strong>${subTotal} / 200</strong></td>
        </tr>`;
        marksBody.innerHTML += row;
      }

      document.getElementById("grand-total").innerText = totalObtained;
      document.getElementById("max-total").innerText = totalMaxMarks;
      document.getElementById("percentage").innerText = ((totalObtained / totalMaxMarks) * 100).toFixed(2);

      resultCard.style.display = "block";
    } else {
      errorMsg.style.display = "block";
    }
  }
</script>

</body>
</html>
